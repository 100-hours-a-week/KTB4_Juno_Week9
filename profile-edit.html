<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>회원정보 수정</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/common.css" />
    <link rel="stylesheet" href="./css/user.css" />
  </head>

  <body class="profile-page-body">
    <header class="profile-top-header">
      <a
        href="./posts.html"
        class="profile-back-button"
        aria-label="게시글 목록으로 이동"
      >
        <span class="material-symbols-outlined">arrow_back</span>
      </a>

      <h1 class="profile-header-title">Community</h1>

      <div class="profile-header-menu-wrapper">
        <button
          type="button"
          class="header-profile-button profile-header-button"
          aria-label="회원 메뉴"
        >
          <span class="header-profile-image profile-header-image"></span>
        </button>

        <nav
          class="header-profile-menu profile-header-menu"
          aria-label="회원 메뉴"
        >
          <a href="./profile-edit.html" class="header-profile-menu-item">
            회원정보 수정
          </a>

          <a
            href="./profile-edit.html#securitySection"
            class="header-profile-menu-item"
          >
            비밀번호 수정
          </a>

          <button type="button" class="header-profile-menu-item logout-button">
            로그아웃
          </button>
        </nav>
      </div>
    </header>

    <main class="profile-edit-page">
      <section class="profile-edit-section">
        <div class="profile-page-heading">
          <h2 class="profile-edit-title">회원정보 수정</h2>

          <p class="profile-edit-description">
            프로필 정보와 비밀번호를 변경할 수 있습니다.
          </p>
        </div>

        <!-- 프로필 이미지·닉네임 수정 폼 -->
        <form id="profileEditForm" class="profile-edit-form" novalidate>
          <section class="profile-setting-card profile-photo-card">
            <div class="profile-image-field">
              <input
                id="profileImageInput"
                class="profile-image-input"
                type="file"
                accept="image/*"
              />

              <label
                for="profileImageInput"
                class="profile-image-edit-button"
                aria-label="프로필 사진 변경"
              >
                <span
                  class="material-symbols-outlined profile-image-placeholder"
                >
                  person
                </span>

                <span class="profile-image-hover-layer">
                  <span class="material-symbols-outlined"> photo_camera </span>
                </span>

                <span class="profile-image-edit-badge">
                  <span class="material-symbols-outlined"> edit </span>
                </span>
              </label>

              <p class="profile-image-description">
                프로필 사진을 변경하려면 이미지를 눌러주세요.
              </p>
            </div>
          </section>

          <section class="profile-setting-card nickname-setting-card">
            <div class="profile-setting-title">
              <span class="material-symbols-outlined">badge</span>
              <h3>닉네임 변경</h3>
            </div>

            <div class="profile-info-field">
              <!-- <label for="nickname" class="profile-field-label"> 닉네임 </label> -->

              <input
                id="nickname"
                class="profile-nickname-input"
                type="text"
                maxlength="10"
                autocomplete="nickname"
                placeholder="닉네임을 입력해주세요."
              />

              <p class="profile-setting-description">
                게시글과 댓글에 표시되는 이름입니다.
              </p>

              <p
                id="profileHelperText"
                class="profile-helper-text"
                aria-live="polite"
              ></p>
            </div>

            <p id="profileEmail" class="profile-email" hidden></p>

            <button type="submit" class="profile-submit-button">
              <span class="material-symbols-outlined">save</span>
              프로필 정보 저장
            </button>
          </section>
        </form>

        <!-- 비밀번호 수정 폼 -->
        <form id="profilePasswordForm" class="profile-password-form" novalidate>
          <section class="profile-setting-card security-setting-card">
            <div class="profile-setting-title">
              <span class="material-symbols-outlined">lock</span>
              <h3>비밀번호 변경</h3>
            </div>

            <p class="profile-setting-description security-description">
              새로운 비밀번호를 입력해주세요.
            </p>

            <div class="profile-password-field">
              <label for="profilePassword" class="profile-password-label">
                새 비밀번호
              </label>

              <div class="profile-password-input-wrapper">
                <input
                  id="profilePassword"
                  class="profile-password-input"
                  type="password"
                  autocomplete="new-password"
                  placeholder="새 비밀번호를 입력해주세요."
                />

                <button
                  type="button"
                  class="password-visibility-button"
                  data-target="profilePassword"
                  aria-label="비밀번호 표시 전환"
                >
                  <span class="material-symbols-outlined"> visibility </span>
                </button>
              </div>

              <p
                id="profilePasswordHelperText"
                class="profile-password-helper-text"
                aria-live="polite"
              ></p>
            </div>

            <div class="profile-password-field">
              <label
                for="profilePasswordConfirm"
                class="profile-password-label"
              >
                새 비밀번호 확인
              </label>

              <div class="profile-password-input-wrapper">
                <input
                  id="profilePasswordConfirm"
                  class="profile-password-input"
                  type="password"
                  autocomplete="new-password"
                  placeholder="새 비밀번호를 한 번 더 입력해주세요."
                />

                <button
                  type="button"
                  class="password-visibility-button"
                  data-target="profilePasswordConfirm"
                  aria-label="비밀번호 확인 표시 전환"
                >
                  <span class="material-symbols-outlined"> visibility </span>
                </button>
              </div>

              <p
                id="profilePasswordConfirmHelperText"
                class="profile-password-helper-text"
                aria-live="polite"
              ></p>
            </div>

            <button type="submit" class="profile-password-submit-button">
              <span class="material-symbols-outlined">lock_reset</span>
              비밀번호 변경
            </button>
          </section>
        </form>

        <!-- <a href="./posts.html" class="profile-cancel-button"> 취소 </a> -->

        <button type="button" class="withdraw-button">회원 탈퇴</button>
      </section>
    </main>

    <div class="profile-toast" id="profileToast" role="status">
      회원정보가 수정되었습니다.
    </div>

    <div class="modal-backdrop" id="withdrawModal">
      <div class="withdraw-modal">
        <h3 class="withdraw-modal-title">회원탈퇴 하시겠습니까?</h3>

        <p class="withdraw-modal-description">
          탈퇴한 계정은 복구할 수 없습니다.
        </p>

        <div class="withdraw-modal-actions">
          <button type="button" class="withdraw-modal-cancel-button">
            취소
          </button>

          <button type="button" class="withdraw-modal-confirm-button">
            확인
          </button>
        </div>
      </div>
    </div>

    <nav class="profile-bottom-navigation" aria-label="하단 메뉴">
      <button type="button" class="profile-navigation-item" disabled>
        <span class="material-symbols-outlined">home</span>
        <span>홈</span>
      </button>

      <a href="./posts.html" class="profile-navigation-item">
        <span class="material-symbols-outlined">forum</span>
        <span>게시판</span>
      </a>

      <button type="button" class="profile-navigation-item" disabled>
        <span class="material-symbols-outlined">bookmark</span>
        <span>북마크</span>
      </button>

      <a
        href="./profile-edit.html"
        class="profile-navigation-item active"
        aria-current="page"
      >
        <span
          class="material-symbols-outlined"
          style="font-variation-settings: &quot;FILL&quot; 1"
        >
          person
        </span>
        <span>프로필</span>
      </a>
    </nav>

    <script src="./js/config.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/user.js"></script>
  </body>
</html>
