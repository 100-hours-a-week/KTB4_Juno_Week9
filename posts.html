<!doctype html>
<html lang="ko" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>게시글 목록</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/common.css" />
    <link rel="stylesheet" href="./css/posts.css" />
  </head>

  <body class="posts-body">
    <header class="board-header" id="topHeader">
      <div class="board-header-left">
        <button
          type="button"
          class="board-header-back-button"
          id="boardBackButton"
          aria-label="이전 페이지로 이동"
        >
          <span class="material-symbols-outlined">arrow_back</span>
        </button>

        <h1 class="board-header-title">Community</h1>
      </div>

      <div class="board-profile-area">
        <button
          class="header-profile-button board-profile-button"
          type="button"
          aria-label="회원 메뉴"
        >
          <span class="header-profile-image board-profile-image"></span>
        </button>

        <nav
          class="header-profile-menu board-profile-menu"
          aria-label="회원 메뉴"
        >
          <a href="./profile-edit.html" class="header-profile-menu-item">
            회원정보 수정
          </a>

          <a href="./password-edit.html" class="header-profile-menu-item">
            비밀번호 수정
          </a>

          <button type="button" class="header-profile-menu-item logout-button">
            로그아웃
          </button>
        </nav>
      </div>
    </header>

    <main class="posts-page">
      <section class="posts-section">
        <div class="posts-heading">
          <h2 class="posts-title">Community Board</h2>

          <p class="posts-description">
            다른 사용자들과 자유롭게 이야기를 나눠보세요.
          </p>
        </div>

        <div class="post-filter-list" aria-label="게시글 필터">
          <button type="button" class="post-filter-chip active">
            전체 게시글
          </button>

          <button type="button" class="post-filter-chip" disabled>
            자유 이야기
          </button>

          <button type="button" class="post-filter-chip" disabled>후기</button>

          <button type="button" class="post-filter-chip" disabled>
            정보 공유
          </button>
        </div>

        <div class="post-list" id="postList"></div>
      </section>
    </main>

    <a
      href="./post-create.html"
      class="post-create-floating-button"
      aria-label="게시글 작성"
    >
      <span class="material-symbols-outlined">add</span>
    </a>

    <nav class="board-bottom-navigation" aria-label="하단 메뉴">
      <button
        type="button"
        class="board-navigation-item"
        disabled
        aria-label="홈"
      >
        <span class="material-symbols-outlined">home</span>
        <span>홈</span>
      </button>

      <a
        href="./posts.html"
        class="board-navigation-item active"
        aria-current="page"
      >
        <span
          class="material-symbols-outlined"
          style="font-variation-settings: &quot;FILL&quot; 1"
        >
          forum
        </span>
        <span>게시판</span>
      </a>

      <button
        type="button"
        class="board-navigation-item"
        disabled
        aria-label="북마크"
      >
        <span class="material-symbols-outlined">bookmark</span>
        <span>북마크</span>
      </button>

      <a href="./profile-edit.html" class="board-navigation-item">
        <span class="material-symbols-outlined">person</span>
        <span>프로필</span>
      </a>
    </nav>

    <script src="./js/config.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/posts.js"></script>
  </body>
</html>
